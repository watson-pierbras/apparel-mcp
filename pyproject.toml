[project]
name = "apparel-mcp"
version = "0.1.0"
description = "SQLite-backed MCP server for SanMar and S&S Activewear wholesale apparel data"
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=2.3.0",
    "zeep>=4.2.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "aiosqlite>=0.20.0",
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
