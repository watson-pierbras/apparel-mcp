name: Apparel Data Sync

on:
  schedule:
    # Daily full sync at 6:00 AM ET (10:00 UTC)
    - cron: "0 10 * * *"

  # Manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      supplier:
        description: "Supplier to sync"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - sanmar
          - ssactivewear
      sync_type:
        description: "Sync type"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - incremental
          - inventory_only

env:
  PYTHON_VERSION: "3.12"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Download existing database
        uses: actions/download-artifact@v4
        with:
          name: apparel-db
          path: ./data/
        continue-on-error: true

      - name: Initialize database
        run: python scripts/setup_db.py
        env:
          DB_PATH: ./data/apparel.db

      - name: Seed styles (if needed)
        run: python scripts/seed_styles.py --csv-dir ./data
        env:
          DB_PATH: ./data/apparel.db
        continue-on-error: true

      - name: Resolve sync parameters
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "supplier=${{ inputs.supplier }}" >> $GITHUB_OUTPUT
            echo "sync_type=${{ inputs.sync_type }}" >> $GITHUB_OUTPUT
          else
            echo "supplier=all" >> $GITHUB_OUTPUT
            echo "sync_type=full" >> $GITHUB_OUTPUT
          fi

      - name: Run sync
        env:
          DB_PATH: ./data/apparel.db
          SANMAR_CUSTOMER_NUMBER: ${{ secrets.SANMAR_CUSTOMER_NUMBER }}
          SANMAR_USERNAME: ${{ secrets.SANMAR_USERNAME }}
          SANMAR_PASSWORD: ${{ secrets.SANMAR_PASSWORD }}
          SS_ACCOUNT_NUMBER: ${{ secrets.SS_ACCOUNT_NUMBER }}
          SS_API_KEY: ${{ secrets.SS_API_KEY }}
        run: |
          python scripts/run_sync.py \
            --supplier ${{ steps.resolve.outputs.supplier }} \
            --type ${{ steps.resolve.outputs.sync_type }}

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apparel-db
          path: ./data/apparel.db
          retention-days: 90
          overwrite: true

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apparel.db
          git diff --cached --quiet || git commit -m "chore: daily sync $(date -u +%Y-%m-%d)"
          git push

      - name: Sync summary
        if: always()
        run: |
          echo "### Sync Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Supplier:** ${{ steps.resolve.outputs.supplier }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ steps.resolve.outputs.sync_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
